<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="maskableLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecfdf5" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable circle/squircle cutting -->
  <rect width="512" height="512" fill="url(#maskableGrad)" />

  <!-- Inner safe zone (65% center area) -->
  <g transform="translate(136, 136) scale(10)">
    <path 
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" 
      fill="none" 
      stroke="url(#maskableLeaf)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" 
      fill="none" 
      stroke="url(#maskableLeaf)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
